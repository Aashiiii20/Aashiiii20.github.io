function filt(rows,k,{type}={}){
  const q=(st.q[k]||"").toLowerCase(), f=st.f;
  return rows.filter(r=>(!q||`${r.name} ${r.location} ${r.source}`.toLowerCase().includes(q))
   &&(!f[k+"src"]||f[k+"src"]==="Any"||r.source===f[k+"src"])
   &&(!type||!f[k+"type"]||f[k+"type"]==="Any"||r[type]===f[k+"type"]));
}
const bar=(k,shown,total,typeLabel,typeOpts,extra="")=>`<div class="flex flex-wrap gap-2 items-center">${search(k)}${sel(k+"src",st.f[k+"src"]||"Any",SOURCES,"Source")}${typeLabel?sel(k+"type",st.f[k+"type"]||"Any",typeOpts,typeLabel):""}${sel(k+"date","Any time",DATES)}<div class="ml-auto flex items-center gap-3"><span class="text-xs text-muted-foreground">${shown} of ${total} records</span>${extra}</div></div>`;

function brandsTable(rows,dropped){
  return card([{t:"Brand Name"},{t:"Type"},{t:"Category"},{t:"Location"},{t:"Contacts",r:1},{t:"Source"},{t:"Status"},{t:"Last Activity"},{t:"Actions",r:1}],
  rows.map(b=>`<tr class="border-b last:border-0 hover:bg-muted/50 text-sm">
   ${td(esc(b.name),"font-medium text-foreground")}
   ${td(dropped?esc(b.category):"Brand","text-muted-foreground")}
   ${td(dropped
     ?`<select data-restore="${b.id}" class="sel h-8 w-[140px] rounded-md border border-input bg-card px-3 text-xs text-rose-700">${LEAD_CATS.map(c=>`<option>${c}</option>`).join("")}<option selected>Dropped</option></select>`
     :`<select data-tier="${b.id}" class="sel h-8 w-[140px] rounded-md border border-input bg-card px-3 text-xs">${b.category?"":`<option selected disabled>Select</option>`}${TIERS.map(c=>`<option ${c===b.category?"selected":""}>${c}</option>`).join("")}</select>`)}
   ${td(esc(b.location),"text-muted-foreground")}
   ${td(dropped?0:b.contacts,"text-right font-medium")}
   ${td(srcLink(b.source))}
   ${td(badge(rowStatus[dropped?"Rejected":b.status],dropped?"Rejected":b.status))}
   ${td(fmtDate(b.last),"text-xs text-muted-foreground whitespace-nowrap")}
   ${td(actions(b.id,dropped?"dropped":"brand",false))}</tr>`).join(""));

function reviewQueue(){
  const rows=filt(S.review,"rq",{type:"type"});
  const total=S.review.length;
  return `<div class="space-y-5">
   <div><h2 class="text-xl font-bold text-foreground">Brands · Review Queue</h2><p class="text-sm text-muted-foreground mt-0.5">Vet scraped jewellery brands before approval</p></div>
   <div class="flex flex-wrap gap-2 items-center">${search("rq")}${sel("rqsrc",st.f.rqsrc||"Any",SOURCES,"Source")}${sel("rqtype",st.f.rqtype||"Any",["Brand","Manufacturer","Institution","Designer"],"Lead Type")}${sel("rqconf","Any confidence",["Any confidence","High","Supporting","Discovery only"])}${sel("rqdate","Any time",DATES)}
    <div class="ml-auto flex items-center gap-3"><span class="text-xs text-muted-foreground">${rows.length} of ${total} records</span>${total?`<button data-act="approveAll" class="green inline-flex items-center gap-2 h-9 px-3 rounded-md text-xs font-medium ic"><i data-lucide="check" style="width:14px;height:14px"></i>Approve all ${total}</button>`:""}</div></div>
   ${card([{t:"#"},{t:"Lead Name"},{t:"Type"},{t:"Industry"},{t:"Source"},{t:"Location"},{t:"Campaign"},{t:"Contact"},{t:"Confidence"},{t:"Found"},{t:"Duplicate"},{t:"Actions",r:1}],
    rows.length?rows.map((l,i)=>`<tr class="border-b last:border-0 hover:bg-muted/50 text-sm">
     ${td(i+1,"text-xs text-muted-foreground tabular-nums")}${td(esc(l.name),"font-medium text-foreground")}${td(l.type,"text-muted-foreground")}${td("Jewellery","text-muted-foreground")}
     ${td(`<div class="flex flex-col gap-1"><span class="text-foreground text-xs font-medium">${l.source}</span><span class="text-[11px]">Scraper</span></div>`,"text-muted-foreground")}
     ${td(`<span class="inline-flex items-center gap-1 whitespace-nowrap"><i data-lucide="map-pin" class="w-3 h-3"></i>${esc(l.location)}</span>`,"text-muted-foreground")}
     ${td(esc(l.campaign),"text-xs text-muted-foreground")}${td(badge("text-muted-foreground border-border","None"))}
     ${td(l.conf,"font-medium whitespace-nowrap "+evTone[l.conf])}
     ${td(`<span class="inline-flex items-center gap-1"><i data-lucide="calendar-days" class="w-3 h-3"></i>${new Date(l.found).toLocaleDateString()}</span>`,"text-muted-foreground text-xs")}
     ${td(badge(risk[l.dup],l.dup))}${td(actions(l.id,"review",true))}</tr>`).join("")
    :`<tr><td colspan="12" class="text-center text-sm text-muted-foreground py-10">No records match the current filters.</td></tr>`)}
   <p class="text-xs text-muted-foreground">Page 1 of 1 · ${rows.length} lead${rows.length===1?"":"s"}</p></div>`;
}

function brandsSection(){
  const ap=filt(S.brands,"ap",{type:"category"}), dr=filt(S.dropped,"dr",{type:"category"});
  let body;
  if(st.brandTab==="approved")body=`<div class="space-y-3">${bar("ap",ap.length,S.brands.length,"Category",TIERS)}${ap.length?brandsTable(ap):empty("No approved brands.")}</div>`;
  else if(st.brandTab==="review")body=reviewQueue();
  else body=`<div class="space-y-3">${bar("dr",dr.length,S.dropped.length,"Lead Type",["Brand","Manufacturer","Institution","Designer"])}${dr.length?brandsTable(dr,true):empty("No dropped leads.")}</div>`;
  return `<div class="space-y-4">${tabs([["approved","Approved Brands",S.brands.length],["review","Review Queue",S.review.length],["dropped","Dropped",S.dropped.length]],st.brandTab,"brandTab")}<div class="fade">${body}</div></div>`;
}

function partnersSection(){
  const P=S.partners, kinds=[["manufacturers","Manufacturers",P.manufacturers.length],["institutions","Institutions",P.institutions.length],["designers","Designers",P.designers.length],["influencers","Influencers",S.influencers.length]];
  const sub=`<div class="border-b border-border"><div class="flex flex-wrap gap-1 pb-1">${kinds.map(([v,l,n])=>`<button data-set="partner" data-val="${v}" class="inline-flex items-center rounded-md px-3 py-1.5 text-sm font-medium ${v===st.partner?"bg-muted text-foreground":"text-muted-foreground"}">${l}${chip(n)}</button>`).join("")}</div></div>`;
  let body;
  if(st.partner==="influencers"){
    const q=(st.q.inf||"").toLowerCase(), rows=S.influencers.filter(i=>!q||i.name.toLowerCase().includes(q)||i.ig.includes(q));
    const by=s=>rows.filter(i=>i.status===s), cur=by(st.inflTab);
    body=`<div class="space-y-4">${tabs([["Active","Active",by("Active").length],["Inactive","Inactive",by("Inactive").length]],st.inflTab,"inflTab")}
     <div class="relative w-64"><i data-lucide="search" class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-muted-foreground"></i><input data-q="inf" value="${esc(st.q.inf||"")}" placeholder="Search…" class="flex h-9 w-full rounded-md border border-input pl-8 pr-3 text-sm bg-card"></div>
     ${cur.length?card([{t:"Influencer Name"},{t:"Instagram"},{t:"Followers",r:1},{t:"Category"},{t:"Assigned To"},{t:"Status"},{t:"Actions",r:1}],cur.map(i=>`<tr class="border-b last:border-0 hover:bg-muted/50 text-sm">${td(esc(i.name),"font-medium")}${td(i.ig,"text-muted-foreground")}${td(i.followers,"text-right font-medium")}${td(i.category,"text-muted-foreground")}${td(i.assigned,"text-muted-foreground")}${td(badge(i.status==="Active"?rowStatus.Approved:pipeStyle["Gone Cold"],i.status))}${td(actions(i.id,"influencer",false))}</tr>`).join("")):empty(`No ${st.inflTab.toLowerCase()} influencers.`)}</div>`;
  } else {
    const all=P[st.partner], label={manufacturers:"Manufacturer",institutions:"Institution",designers:"Designer"}[st.partner];
    const rows=filt(all,"pp"), by=s=>rows.filter(r=>r.status===s), cur=by(st.pipeTab);
    body=`<div class="space-y-4">${tabs([["Discovered","Discovered",by("Discovered").length],["Contacted","Contacted",by("Contacted").length],["Gone Cold","Gone Cold",by("Gone Cold").length]],st.pipeTab,"pipeTab")}
     <div class="space-y-3">${bar("pp",cur.length,all.filter(r=>r.status===st.pipeTab).length)}
     ${card([{t:label+" Name"},{t:"Type"},{t:"Location"},{t:label==="Designer"?"Brand / Studio":"Contact Person"},{t:"Source"},{t:"Pipeline Status"},{t:"Last Activity"},{t:"Actions",r:1}],cur.map(r=>`<tr class="border-b last:border-0 hover:bg-muted/50 text-sm">${td(esc(r.name),"font-medium")}${td(`<select data-move="${r.id}" class="sel h-8 w-[140px] rounded-md border border-input bg-card px-3 text-xs">${["Manufacturer","Institution","Designer"].map(k=>`<option ${k===label?"selected":""}>${k}</option>`).join("")}<option class="text-rose-700">Dropped</option></select>`)}${td(esc(r.location),"text-muted-foreground")}${td(esc(r.contact),"text-muted-foreground")}${td(srcLink(r.source))}${td(badge(pipeStyle[r.status],r.status))}${td(fmtDate(r.last),"text-xs text-muted-foreground whitespace-nowrap")}${td(actions(r.id,"partner",false))}</tr>`).join(""))}</div></div>`;
  }
  return `<div class="space-y-5">${sub}<div class="fade">${body}</div></div>`;
}

function renderLeads(){
  const focus=document.activeElement?.dataset?.q, pos=document.activeElement?.selectionStart;
  document.getElementById("page").innerHTML=`
   <div>
    <a href="#" class="text-sm text-muted-foreground hover:text-foreground inline-flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i>Back to Overview</a>
    <div class="flex items-start justify-between gap-3 flex-wrap mt-3">
     <div><h1 class="text-2xl font-bold text-foreground">Jewellery</h1><p class="text-sm text-muted-foreground mt-1">Manage jewellery brands, industry partners, and related business development activity.</p></div>
     <button data-act="add" class="inline-flex items-center gap-2 h-10 px-4 rounded-md bg-primary text-primary-foreground text-sm font-medium hover:bg-primary/90"><i data-lucide="plus" class="w-4 h-4"></i>Add Lead</button>
    </div>
   </div>
   <div class="flex justify-center"><div class="inline-flex rounded-xl bg-muted/50 p-1">${[["brands","Brands"],["partners","Partners"]].map(([v,l])=>`<button data-set="section" data-val="${v}" class="rounded-lg px-6 py-2 text-sm font-medium transition-colors ${st.section===v?"bg-card text-foreground border-2 border-primary/60 shadow-sm":"text-muted-foreground hover:text-foreground border-2 border-transparent"}">${l}</button>`).join("")}</div></div>

function toast(title,desc){
  const t=document.createElement("div");
  t.className="fade bg-card border border-border shadow-lg rounded-lg px-4 py-3 w-[320px] max-w-[calc(100vw-32px)] text-sm";
  t.innerHTML=`<div class="flex gap-2 items-start ic"><i data-lucide="circle-check" class="text-emerald-600 shrink-0"></i><div><p class="font-medium">${esc(title)}</p>${desc?`<p class="text-muted-foreground text-xs mt-0.5">${esc(desc)}</p>`:""}</div></div>`;
  document.getElementById("toasts").appendChild(t);lucide.createIcons();setTimeout(()=>t.remove(),3200);
}

const M=document.getElementById("modal");
function dialog(inner,wide){M.innerHTML=`<div class="fade relative bg-background border border-border shadow-lg rounded-lg p-6 w-full ${wide?"max-w-2xl":"max-w-md"} max-h-[90vh] overflow-auto grid gap-4">${inner}<button class="icon-btn absolute right-3 top-3" data-close title="Close"><i data-lucide="x"></i></button></div>`;M.hidden=false;lucide.createIcons();}
const close=()=>{M.hidden=true;M.innerHTML="";};
const footer=(btns)=>`<div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2">${btns}</div>`;
const outline=(t,a="data-close")=>`<button ${a} class="h-10 px-4 rounded-md border border-input bg-background text-sm font-medium hover:bg-muted">${t}</button>`;
const field=(l,inp)=>`<div class="space-y-1.5"><label class="text-xs font-medium">${l}</label>${inp}</div>`;
const inputCls="flex h-10 w-full rounded-md border border-input bg-background px-3 text-sm";

function findAny(id){return S.review.find(x=>x.id===id)||S.brands.find(x=>x.id===id)||S.dropped.find(x=>x.id===id)||Object.values(S.partners).flat().find(x=>x.id===id)||S.influencers.find(x=>x.id===id);}

function profile(r,kind){
  const row=(k,v)=>`<div class="flex justify-between gap-4 py-1.5 border-b border-border last:border-0"><span class="text-muted-foreground">${k}</span><span class="text-right">${v}</span></div>`;
  const tier=r.category&&TIERS.includes(r.category)?r.category:(kind==="review"?"Pending":"");
  dialog(`<div><p class="text-[11px] uppercase tracking-wider text-muted-foreground font-semibold">${kind==="review"?"Review Queue":"Jewellery"} · ${esc(r.type||r.category||"Brand")}</p><h3 class="text-lg font-semibold mt-1">${esc(r.name)}</h3><p class="text-sm text-muted-foreground inline-flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i>${esc(r.location||"")}</p></div>
   ${kind==="brand"||kind==="review"?`<div class="bg-card border border-border rounded-lg px-5 py-4 space-y-3"><div class="flex items-start justify-between gap-3"><h4 class="text-sm font-semibold">Commercial tier</h4>${badge(tier&&tier!=="Pending"?(tier==="Designer Brand"?"bg-violet-100 text-violet-800 border-violet-200":"bg-emerald-100 text-emerald-800 border-emerald-200"):"bg-muted text-muted-foreground border-border",(tier||"Pending")+" · "+(tier&&tier!=="Pending"?"confirmed":"not assessed"))}</div><p class="text-sm leading-relaxed">${tier==="Tier 1"?"58 stores across the GCC from the official store locator; 18K diamond lines on the official website.":tier==="Designer Brand"?"Independent designer selling one-of-one 18K gold pieces under her own name.":tier==="Tier 2"?"Single-city retailer under 50 stores with 21K/22K solid gold on its official Instagram.":"Run the research scan to have Claude propose Tier 1, Tier 2 or Designer Brand from the brand's official evidence."}</p><p class="text-xs text-muted-foreground">${tier&&tier!=="Pending"?"Proposed by Claude · High confidence · Confirmed by reviewer":""}</p></div>`:""}
   ${kind==="dropped"?`<div class="rounded-md border border-rose-200 bg-rose-50 text-rose-800 px-4 py-3 text-sm">${esc(r.why)}</div>`:""}
   ${kind==="review"?`<div class="rounded-md border border-sky-200 bg-sky-50 text-sky-800 px-4 py-3 text-sm">Found by ${esc(r.source)}. ${esc(r.reason)}</div>`:""}
   <div class="text-sm">${row("Source",esc(r.source||"Manual"))}${r.conf?row("Evidence",`<span class="font-medium ${evTone[r.conf]}">${r.conf}</span>`):""}${r.contacts!=null?row("Contacts",r.contacts):""}${r.last||r.found?row("Last activity",fmtDate(r.last||r.found)):""}${r.ig?row("Instagram",r.ig):""}</div>
   ${kind==="brand"||kind==="review"?`<div class="flex flex-wrap gap-2">${["Enrich","Enrich More","Find Decision Makers"].map(b=>`<button data-act="fake" data-msg="${b}" data-name="${esc(r.name)}" class="h-9 px-3 rounded-md border border-input bg-background text-xs font-medium hover:bg-muted">${b}</button>`).join("")}</div>`:""}`,true);
}

document.addEventListener("click",e=>{
  if(e.target===M||e.target.closest("[data-close]")){close();return;}
  const s=e.target.closest("[data-set]");
  if(s){st[s.dataset.set]=s.dataset.val;render();return;}
  if(e.target.closest("[data-side]")){e.preventDefault();st.screen=e.target.closest("[data-side]").dataset.side;st.sub=null;render();window.scrollTo({top:0});return;}
  if(e.target.closest('a[href="#"]')){e.preventDefault();return;}
  const a=e.target.closest("[data-act]"); if(!a)return;
  const id=a.dataset.id, r=id&&findAny(id);
  switch(a.dataset.act){
   case"view":profile(r,a.dataset.kind);break;
   case"approve":dialog(`<div><h3 class="text-lg font-semibold">Approve record?</h3><p class="text-sm text-muted-foreground mt-1.5">Approve <span class="font-medium text-foreground">${esc(r.name)}</span> and move it to Approved Leads?</p></div>${footer(outline("Cancel")+`<button data-act="doApprove" data-id="${id}" class="green inline-flex items-center gap-2 h-10 px-4 rounded-md text-sm font-medium ic"><i data-lucide="check"></i>Approve</button>`)}`);break;
   case"doApprove":approve([id]);close();break;
   case"reject":dialog(`<div><h3 class="text-lg font-semibold">Reject record</h3><p class="text-sm text-muted-foreground mt-1.5">Provide a reason for rejecting <span class="font-medium text-foreground">${esc(r.name)}</span>.</p></div>
     ${field("Reason",`<select id="rej-reason" class="sel ${inputCls} bg-card">${REJECT_REASONS.map(x=>`<option>${x}</option>`).join("")}</select>`)}${field("Notes (optional)",`<textarea id="rej-note" rows="3" placeholder="Add context..." class="w-full rounded-md border border-input bg-background px-3 py-2 text-sm"></textarea>`)}
     ${footer(outline("Cancel")+`<button data-act="doReject" data-id="${id}" class="inline-flex items-center gap-2 h-10 px-4 rounded-md bg-destructive text-white text-sm font-medium ic"><i data-lucide="x"></i>Reject</button>`)}`);break;
   case"doReject":{const reason=document.getElementById("rej-reason").value;S.review=S.review.filter(x=>x.id!==id);S.dropped.unshift({id,name:r.name,category:r.type,location:r.location,source:r.source,last:new Date().toISOString(),why:"Rejected in review: "+reason});close();render();toast(`Rejected ${r.name}`,"Kept on record, not deleted.");break;}
   case"dup":dialog(`<div><h3 class="text-lg font-semibold flex items-center gap-2 ic"><i data-lucide="triangle-alert" class="text-amber-600"></i>Possible duplicate</h3><p class="text-sm text-muted-foreground mt-1.5">Review the possible match for <span class="font-medium text-foreground">${esc(r.name)}</span> and choose an action.</p></div>
     <div class="bg-muted/40 border border-border rounded-md p-3 text-sm text-muted-foreground">No automatic match found — choose how to handle this manually.</div>
     ${field("Suggested action",`<select class="sel ${inputCls} bg-card"><option>Keep both</option><option>Merge into existing</option><option>Discard incoming</option></select>`)}
     ${footer(outline("Cancel")+`<button data-act="fake" data-msg="Duplicate handled" data-name="${esc(r.name)}" class="green h-10 px-4 rounded-md text-sm font-medium">Apply</button>`)}`);break;
   case"task":dialog(`<div><h3 class="text-lg font-semibold">Create task</h3><p class="text-sm text-muted-foreground mt-1.5">Linked to <span class="font-medium text-foreground">${esc(r.name)}</span>.</p></div>
     ${field("Task title",`<input id="task-title" class="${inputCls}" value="Follow up with ${esc(r.name)}">`)}
     <div class="grid grid-cols-2 gap-3">${field("Assigned to",`<select class="sel ${inputCls} bg-card"><option>Sara</option><option>Ahmed</option><option>Aashiya</option></select>`)}${field("Due date",`<input type="date" class="${inputCls}">`)}</div>
     ${field("Notes",`<textarea rows="3" placeholder="Add details..." class="w-full rounded-md border border-input bg-background px-3 py-2 text-sm"></textarea>`)}
     ${footer(outline("Cancel")+`<button data-act="fake" data-msg="Task created" class="green h-10 px-4 rounded-md text-sm font-medium">Create Task</button>`)}`);break;
   case"approveAll":dialog(`<div><h3 class="text-lg font-semibold">Approve all ${S.review.length} leads?</h3><p class="text-sm text-muted-foreground mt-1.5">Every lead in this queue is approved at once and queued for enrichment. They stay on record and can be rejected afterwards, but this is one decision covering all ${S.review.length} of them.</p></div>${footer(outline("Cancel")+`<button data-act="doApproveAll" class="green inline-flex items-center gap-2 h-10 px-4 rounded-md text-sm font-medium ic"><i data-lucide="check"></i>Approve all ${S.review.length}</button>`)}`);break;
   case"doApproveAll":approve(S.review.map(x=>x.id));close();break;
   case"add":dialog(`<div><h3 class="text-lg font-semibold">Add jewellery lead</h3><p class="text-sm text-muted-foreground mt-1.5">A lead typed in by hand goes to the Review Queue.</p></div>
     ${field("Name",`<input id="add-name" class="${inputCls}" placeholder="Brand name" value="Noor Al Khaleej Gold">`)}
     <div class="grid grid-cols-2 gap-3">${field("Type",`<select id="add-type" class="sel ${inputCls} bg-card"><option>Brand</option><option>Manufacturer</option><option>Institution</option><option>Designer</option></select>`)}${field("City, Country",`<input id="add-loc" class="${inputCls}" value="Dubai, UAE">`)}</div>
     ${field("Website or Instagram",`<input id="add-link" class="${inputCls}" placeholder="https://">`)}
     ${footer(outline("Cancel")+`<button data-act="doAdd" class="h-10 px-4 rounded-md bg-primary text-primary-foreground text-sm font-medium">Add Lead</button>`)}`);break;
   case"doAdd":{const name=document.getElementById("add-name").value.trim()||"Untitled lead";const link=document.getElementById("add-link").value.trim();S.review.unshift({id:"r"+Date.now(),name,type:document.getElementById("add-type").value,source:"Manual Entry",location:document.getElementById("add-loc").value,campaign:"—",conf:link?"High":"Discovery only",found:new Date().toISOString(),dup:"None",reason:"Added by hand"});st.section="brands";st.brandTab="review";close();render();toast(`${name} added`,"Waiting in the Review Queue.");break;}
   case"fake":close();toast(a.dataset.msg,a.dataset.name?`${a.dataset.name} · demo only, nothing was sent`:"Demo only");break;
  }
});
function approve(ids){
  ids.forEach(id=>{const r=S.review.find(x=>x.id===id);if(!r)return;S.review=S.review.filter(x=>x.id!==id);
    if(r.type==="Brand")S.brands.unshift({id,name:r.name,category:"",location:r.location,contacts:0,source:r.source,status:"Approved",last:new Date().toISOString()});
    else{const k={Manufacturer:"manufacturers",Institution:"institutions",Designer:"designers"}[r.type];S.partners[k].unshift({id,name:r.name,location:r.location,contact:"",source:r.source,status:"Discovered",last:new Date().toISOString()});}});
  render();toast(`${ids.length} lead${ids.length===1?"":"s"} approved`,"Run Find Decision Makers from the record's drawer when ready.");
}
document.addEventListener("input",e=>{const k=e.target.dataset.q;if(k){st.q[k]=e.target.value;render();}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.filter){st.f[t.dataset.filter]=t.value;render();}
  if(t.dataset.tier){const b=S.brands.find(x=>x.id===t.dataset.tier);b.category=t.value;render();toast(`${b.name} is now ${t.value}`);}
  if(t.dataset.restore){const b=S.dropped.find(x=>x.id===t.dataset.restore);S.dropped=S.dropped.filter(x=>x!==b);S.review.unshift({id:b.id,name:b.name,type:TIERS.includes(t.value)?"Brand":t.value,source:b.source,location:b.location,campaign:"—",conf:"Supporting",found:new Date().toISOString(),dup:"None",reason:"Brought back from Dropped"});render();toast(`${b.name} is back in review as ${t.value}`);}

  const b=e.target.closest("[data-act2]"); if(!b||b.disabled)return;

   case"igAdd":{const v=document.getElementById("ig-new").value.trim();if(!v)return;const h="@"+v.replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/[@\/]/g,"");D.targets.unshift({id:"t"+Date.now(),handle:h,status:"Active",last:new Date().toISOString()});render();toast("Account added: "+h,"Its posts will appear in the Unified Feed.");break;}
   case"igRun":t.last=new Date().toISOString();if(t.status==="Error")t.status="Active";render();toast("Checked "+t.handle,"No new posts since the last run.");break;
   case"igPause":t.status=t.status==="Paused"?"Active":"Paused";render();break;
   case"igRemove":D.targets=D.targets.filter(x=>x!==t);render();toast("Account removed: "+t.handle);break;
   case"closeScan":D.openScan=null;render();break;
   case"pickPdf":document.querySelector('[data-pdf="brand"]').click();break;
   case"scanUrl":{const v=document.getElementById("bs-url").value.trim();if(!v){toast("Enter a page address first");return;}fakeScan(v.replace(/^https?:\/\//,""),"URL");break;}
   case"follow":D.follow=!D.follow;render();break;
   case"togglePub":pub.on=!pub.on;render();break;
   case"scanPub":fakeScan(new URL(pub.url).host+new URL(pub.url).pathname,"URL");break;
   case"dropPub":D.pubs=D.pubs.filter(x=>x!==pub);render();toast("Publication removed: "+pub.name);break;
   case"addPub":dialog(`<div><h3 class="text-lg font-semibold">Add publication</h3><p class="text-sm text-muted-foreground mt-1.5">A magazine or news page to scan for jewellery businesses.</p></div>${field("Name",`<input id="pub-name" class="${inputCls}" placeholder="Publication name">`)}${field("Address",`<input id="pub-url" class="${inputCls}" placeholder="https://example.com/jewellery">`)}${footer(outline("Cancel")+`<button data-act2="doAddPub" class="green h-10 px-4 rounded-md text-sm font-medium">Add</button>`)}`);break;
   case"doAddPub":{const n=document.getElementById("pub-name").value.trim()||"New publication";let u=document.getElementById("pub-url").value.trim()||"https://example.com/jewellery";if(!/^https?:/.test(u))u="https://"+u;try{new URL(u);}catch{u="https://example.com/jewellery";}D.pubs.push({id:"u"+Date.now(),name:n,url:u,on:true});close();render();toast("Publication added: "+n);break;}
   case"evView":D.evView=id;render();break;
   case"closePage":D.openPage=null;render();break;
   case"evOk":{const ev=findEv(id);ev.status="approved";render();toast("Marked relevant: "+ev.name,"Added to the calendar. Read its exhibitors when the list is out.");break;}
   case"evNo":{const ev=findEv(id);ev.status="rejected";render();break;}
   case"evEx":{const ev=findEv(id);const names=[["Sapphire Lane Jewellers","Dubai, UAE"],["Al Majd Gold","Muscat, Oman"],["Pearl Coast Designs","Manama, Bahrain"]];names.forEach(([n,l],i)=>S.review.unshift({id:"r"+Date.now()+i,name:n,type:"Brand",source:"Google Search",location:l,campaign:ev.name,conf:"High",found:new Date().toISOString(),dup:"None",reason:"Exhibitor at "+ev.name}));ev.read=(ev.read||0)+names.length;render();toast("Exhibitors read: "+ev.name,"3 exhibitors sent to the Review Queue.");break;}
   case"evScan":{const v=document.getElementById("ev-url").value.trim();if(!v){toast("Enter a page address first");return;}const p={id:"e"+Date.now(),name:v.replace(/^https?:\/\//,""),url:v,lastRead:new Date().toISOString(),reading:true,events:[]};D.pages.push(p);render();
     setTimeout(()=>{p.reading=false;p.events=[{id:"v"+Date.now(),name:"Gulf Pearl & Gold Expo",date:"2027-01-18",type:"Jewellery exhibition",status:"pending_review"},{id:"v"+Date.now()+1,name:"Diamond Week Pop-up",date:"2026-12-05",type:"Jewellery pop-up",status:"pending_review"}];render();toast("Event scan finished","2 events found and waiting for a decision.");},1500);break;}
   case"rescan":{const p=D.pages.find(x=>x.id===id);p.lastRead=new Date().toISOString();render();toast("Scan finished: "+p.name,"No new events since the last read.");break;}
   case"deep":toast("Deep scan finished","Each event's own page was read. Sectors updated.");break;
   case"rmPage":D.pages=D.pages.filter(x=>x.id!==id);render();toast("Page removed from the list","Its events stay in the calendar.");break;
   case"addEvent":dialog(`<div><h3 class="text-lg font-semibold">Add event</h3></div>${field("Event name",`<input id="ae-name" class="${inputCls}" placeholder="Event name">`)}${field("Date",`<input id="ae-date" type="date" class="${inputCls}" value="2027-03-01">`)}${field("Venue, city",`<input class="${inputCls}" placeholder="Venue, city">`)}${field("Event page",`<input class="${inputCls}" placeholder="Event page">`)}${footer(outline("Cancel")+`<button data-act2="doAddEvent" class="green h-10 px-4 rounded-md text-sm font-medium">Add</button>`)}`);break;
   case"doAddEvent":{let p=D.pages.find(x=>x.id==="manual");if(!p){p={id:"manual",name:"Manual PDF Upload",url:"",lastRead:new Date().toISOString(),events:[]};D.pages.push(p);}const n=document.getElementById("ae-name").value.trim()||"New event";p.events.push({id:"v"+Date.now(),name:n,date:document.getElementById("ae-date").value||"2027-03-01",type:"Jewellery exhibition",status:"approved"});close();render();toast("Event added: "+n);break;}
   case"unlock":D.admin=true;render();break;
   case"lock":D.admin=false;render();break;
   case"resetPw":dialog(`<div><h3 class="text-base font-semibold">Reset Admin Password</h3><p class="text-xs text-muted-foreground mt-1">Controls access to the Automation Monitor.</p></div>${["Current Password","New Password","Confirm New Password"].map(l=>field(l,`<input type="password" class="${inputCls} h-9">`)).join("")}${footer(outline("Cancel")+`<button data-act="fake" data-msg="Password updated" class="green h-9 px-4 rounded-md text-sm font-medium">Update Password</button>`)}`);break;
   case"stopAll":dialog(`<div><h3 class="text-lg font-semibold">Stop everything now?</h3><p class="text-sm text-muted-foreground mt-1.5">Every run in progress is aborted immediately — LinkedIn, Google, Meta Ads and Shopify campaigns, Brand Scan, Event Scan, IG Monitor, enrichment and research. What they had already found is kept. Nothing that spends credit will start again, including scheduled campaigns, until someone presses Resume.</p></div>${footer(outline("Cancel")+`<button data-act2="doStop" class="h-10 px-4 rounded-md bg-rose-600 hover:bg-rose-700 text-white text-sm font-medium">Stop everything</button>`)}`);break;
   case"doStop":D.halted=new Date().toISOString();D.runs.forEach(r=>{if(r.status==="Running")r.status="Stopped";});close();render();toast("Emergency stop on","Every run stopped. What they found is kept.");break;
   case"resumeAll":D.halted=false;render();toast("Automations resumed","Scheduled campaigns will start at their next run.");break;
   case"retry":case"runNow":if(D.halted){toast("Emergency stop is on","Resume before starting a run.");return;}run.status="Running";run.err=null;run.last=new Date().toISOString();render();toast("Campaign started: "+run.cid,run.name);
     setTimeout(()=>{run.status="Completed";run.searched+=40;run.neu+=4;run.dup+=12;render();toast("Campaign finished: "+run.cid,"4 new leads, 12 duplicates filtered");},2000);break;
   case"viewRun":dialog(`<div><p class="text-[11px] uppercase tracking-wider text-muted-foreground font-semibold font-mono">${run.cid}</p><h3 class="text-lg font-semibold mt-1">${esc(run.name)}</h3><p class="text-sm text-muted-foreground">${run.src} · last run ${fmtDT(run.last)}</p></div>
     <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${[["Searched",run.searched],["New",run.neu],["Duplicates",run.dup],["Cost",run.cost]].map(([l,v])=>`<div class="bg-card border border-border rounded-lg px-3 py-2"><p class="text-[10px] uppercase tracking-wider text-muted-foreground font-semibold">${l}</p><p class="text-lg font-bold tabular-nums">${v}</p></div>`).join("")}</div>
     <div class="text-sm space-y-1.5"><p class="font-medium">Where the new leads went</p><p class="text-muted-foreground">${Math.round(run.neu*.4)} auto-approved · ${Math.round(run.neu*.45)} sent to the Review Queue · ${run.neu-Math.round(run.neu*.4)-Math.round(run.neu*.45)} dropped with a reason code</p></div>`,true);break;
   case"newCampaign":dialog(`<div><h3 class="text-lg font-semibold">Launch Campaign</h3><p class="text-sm text-muted-foreground mt-1.5">Search a source for jewellery leads. Everything found goes through the classifier.</p></div>
     ${field("Campaign name",`<input id="nc-name" class="${inputCls}" value="Gold jewellers, Abu Dhabi">`)}<div class="grid grid-cols-2 gap-3">${field("Source",`<select id="nc-src" class="sel ${inputCls} bg-card">${["Google Maps","Google Search","LinkedIn","Meta Ads","Shopify"].map(s=>`<option>${s}</option>`).join("")}</select>`)}${field("Repeat",`<select class="sel ${inputCls} bg-card"><option>Once</option><option>Daily</option><option>Weekly</option></select>`)}</div>
     ${field("Keywords",`<input class="${inputCls}" value="22k gold jewellery, bridal gold, diamond jewellery">`)}${footer(outline("Cancel")+`<button data-act2="doCampaign" class="green h-10 px-4 rounded-md text-sm font-medium">Launch</button>`)}`);break;
   case"doCampaign":{if(D.halted){close();toast("Emergency stop is on","Resume before launching.");return;}const r={id:"a"+Date.now(),name:document.getElementById("nc-name").value||"New campaign",cid:"JW-00"+(D.runs.length+2),src:document.getElementById("nc-src").value,last:new Date().toISOString(),searched:0,neu:0,dup:0,cost:"$0.00",status:"Running",next:"—"};D.runs.unshift(r);close();render();toast("Campaign started: "+r.cid,r.name);
     setTimeout(()=>{Object.assign(r,{status:"Completed",searched:96,neu:7,dup:19,cost:"$0.88"});render();toast("Campaign finished: "+r.cid,"7 new leads, 19 duplicates filtered");},2500);break;}
   case"saveAgent":toast("Research agent saved","New thresholds apply to the next run.");break;
   case"clearAct":D.act={q:"",type:"All",user:"All"};render();break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f2){D[t.dataset.f2]=t.value;render();}
  if(t.dataset.reclass){const p=D.posts.find(x=>x.id===t.dataset.reclass);p.cat=t.value;render();toast("Post reclassified as "+t.value);}
  if(t.dataset.actf){D.act[t.dataset.actf]=t.value;render();}
  if(t.dataset.pdf&&t.files[0]){const n=t.files[0].name;if(t.dataset.pdf==="brand")fakeScan(n,"PDF");else{const p={id:"e"+Date.now(),name:"Manual PDF Upload — "+n,url:"",lastRead:new Date().toISOString(),events:[{id:"v"+Date.now(),name:"Bayside Jewellery Week",date:"2027-02-02",type:"Jewellery exhibition",status:"pending_review"}]};D.pages.push(p);render();toast("Calendar read: "+n,"1 event found and waiting for a decision.");}t.value="";}
});
render();
</script>

</body></html>
